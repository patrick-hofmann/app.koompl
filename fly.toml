# fly.toml app configuration file generated for app-koompl on 2026-01-12T10:22:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'app-koompl'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
